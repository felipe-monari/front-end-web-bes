<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de cadastro</title>
  <link rel="stylesheet" href="./styles/global.css">
  <script src="./scripts/index.js" defer></script>
</head>
<body>

  <main class="container">
    <header class="cabecalho">
      <p class="sobretitulo">Atividade - Aula 8</p>
      <h1>Cadastro de aluno</h1>
      <p>Preencha todos os campos. Os dados são validados ao enviar.</p>
    </header>

    <form id="form-cadastro" novalidate>

      <fieldset>
        <legend>Dados pessoais</legend>

        <div class="grade">
          <div class="campo largo">
            <label for="nome">Nome completo</label>
            <input type="text" id="nome" name="nome" placeholder="Ex.: Maria da Silva">
            <span class="erro" data-erro="nome"></span>
          </div>

          <div class="campo">
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" placeholder="voce@exemplo.com">
            <span class="erro" data-erro="email"></span>
          </div>

          <div class="campo">
            <label for="cpf">CPF</label>
            <input type="text" id="cpf" name="cpf" placeholder="000.000.000-00" inputmode="numeric" maxlength="14">
            <span class="erro" data-erro="cpf"></span>
          </div>

          <div class="campo">
            <label for="nascimento">Data de nascimento</label>
            <input type="date" id="nascimento" name="nascimento">
            <span class="erro" data-erro="nascimento"></span>
          </div>

          <div class="campo">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" name="telefone" placeholder="(00) 00000-0000" inputmode="numeric" maxlength="15">
            <span class="erro" data-erro="telefone"></span>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Endereço</legend>

        <div class="grade">
          <div class="campo">
            <label for="cep">CEP</label>
            <input type="text" id="cep" name="cep" placeholder="00000-000" inputmode="numeric" maxlength="9">
            <span class="erro" data-erro="cep"></span>
          </div>

          <div class="campo largo">
            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" name="endereco" placeholder="Rua, avenida...">
            <span class="erro" data-erro="endereco"></span>
          </div>

          <div class="campo">
            <label for="numero">Número</label>
            <input type="text" id="numero" name="numero" inputmode="numeric" maxlength="6">
            <span class="erro" data-erro="numero"></span>
          </div>

          <div class="campo">
            <label for="cidade">Cidade</label>
            <input type="text" id="cidade" name="cidade">
            <span class="erro" data-erro="cidade"></span>
          </div>

          <div class="campo">
            <label for="estado">Estado</label>
            <select id="estado" name="estado">
              <option value="">Selecione</option>
              <option value="AC">AC</option><option value="AL">AL</option>
              <option value="AP">AP</option><option value="AM">AM</option>
              <option value="BA">BA</option><option value="CE">CE</option>
              <option value="DF">DF</option><option value="ES">ES</option>
              <option value="GO">GO</option><option value="MA">MA</option>
              <option value="MT">MT</option><option value="MS">MS</option>
              <option value="MG">MG</option><option value="PA">PA</option>
              <option value="PB">PB</option><option value="PR">PR</option>
              <option value="PE">PE</option><option value="PI">PI</option>
              <option value="RJ">RJ</option><option value="RN">RN</option>
              <option value="RS">RS</option><option value="RO">RO</option>
              <option value="RR">RR</option><option value="SC">SC</option>
              <option value="SP">SP</option><option value="SE">SE</option>
              <option value="TO">TO</option>
            </select>
            <span class="erro" data-erro="estado"></span>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Acesso</legend>

        <div class="grade">
          <div class="campo">
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" placeholder="Mínimo 8 caracteres">
            <span class="erro" data-erro="senha"></span>
          </div>

          <div class="campo">
            <label for="confirmar-senha">Confirmar senha</label>
            <input type="password" id="confirmar-senha" name="confirmarSenha">
            <span class="erro" data-erro="confirmarSenha"></span>
          </div>

          <div class="campo largo">
            <label class="termos">
              <input type="checkbox" id="termos" name="termos">
              Li e aceito os termos de uso
            </label>
            <span class="erro" data-erro="termos"></span>
          </div>
        </div>
      </fieldset>

      <div class="acoes">
        <button type="reset" class="botao secundario">Limpar</button>
        <button type="submit" class="botao">Cadastrar</button>
      </div>

    </form>
  </main>
  
</body>
</html>
