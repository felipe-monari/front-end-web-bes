<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Recrutamento On-line</title>
</head>

    <body>
        <header>
            <h1>Recrutamento On-line</h1>
        </header>
        <main>
            <Section>
                <h2>Cadastre seu currículo</h2>
                <form action="#" method="get">
                    <p>Preencha o formulário abaixo para se candidatar à vaga</p>
                    <fieldset>

                        <legend>Dados Pessoais</legend>
                        <div>
                            <label for="nome_id">Nome completo:</label>
                            <input id="nome_id" name="nome" type="text">
                        </div>
                        <div>
                            <label for="telefone_id">Telefone:</label>
                            <input id="telefone_id" name="telefone" type="tel">
                        </div>
                        <div>
                            <label for="email_id">E-mail:</label>
                            <input id="email_id" name="email" type="email">
                        </div>

                        <div>
                            <label for="data_nasc_id">Data de nascimento:</label>
                            <input id="data_nasc_id" name="data_nasc" type="date">
                        </div>

                        <fieldset>
                            <legend>Endereço</legend>

                            <div>
                                <label for="logradouro_id">Logradouro:</label>
                                <input id="logradouro_id" name="logradouro" type="text">
                            </div>

                            <div>
                                <label for="cidade_id">Cidade-UF</label>
                                <input id="cidade_id" name="cidade" type="text">
                            </div>

                            <div>
                                <label for="numeri_id">Número:</label>
                                <input id="numedo_id" name="numero" type="number">
                            </div>

                        </fieldset>
                    </fieldset>

                    <fieldset>
                        <legend>Resumo</legend>
                        <div>
                            <label for="resumo_id">Fale sobre você</label>
                            <textarea id="resumo_id"
                                      name="resumo"></textarea>
                        </div>
                    </fieldset>

                    <fieldset>
                        <legend>Nível desejado</legend>
                        <div>
                            <input id="nivel_estagio_id" 
                                   name="nivel" 
                                   type="radio"
                                   value="estagio">
                            <label for="nivel_estagio_id">Estágio</label>
                        </div>

                        <div>
                            <input id="nivel_junior_id" 
                                   name="nivel" 
                                   type="radio"
                                   value="junior">

                            <label for="nivel_junior_id">Júnior</label>
                        </div>

                        <div>
                            <input id="nivel_pleno_id" 
                                   name="nivel" 
                                   type="radio"
                                   value="pleno">                          
                            <label for="nivel_pleno_id">Pleno</label>
                        </div>

                        <div>
                            <input id="nivel_senior_id" 
                                   name="nivel" 
                                   type="radio"
                                   value="senior">                          
                            <label for="nivel_senior_id">Sênior</label>
                        </div>

                    </fieldset>

                    <fieldset>
                        <legend>Tecnologias que domina:</legend>
                        <div>
                            <input id="tech_html_id" 
                                   name="tecnologias" 
                                   type="checkbox" 
                                   value="html">
                            <label for="tech_html_id">HTML</label>
                        </div>

                        <div>
                            <input id="tech_css_id" 
                                   name="tecnologias" 
                                   type="checkbox" 
                                   value="css">
                            <label for="tech_css_id">CSS</label>
                        </div>

                        <div>
                            <input id="tech_javascript_id" 
                                   name="tecnologias" 
                                   type="checkbox" 
                                   value="javascript">
                            <label for="tech_javascript_id">JavaScript</label>
                        </div>
                    </fieldset>

                </form>
            </Section>
        </main>
        <footer>
            <p>Todos o direitos reservados &copy;</p>
        </footer>
    </body>
</html>
