<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compra de Celular</title>
  </head>

  <body>
    <header>
      <h1>Compra de Celular</h1>
    </header>

    <main>
      <h2>Bem-vindo à nossa loja de celulares!</h2>
      <form action="https://postman-echo.com/post" method="post" enctype="multipart/form-data">
        <p>Preencha o formulário abaixo para realizar a compra do seu celular</p>
        <fieldset>
          <legend>Dados Pessoais</legend>
          <div>
            <label for="nome_id">Nome completo:</label>
            <input id="nome_id" name="nome" type="text" placeholder="Nome completo" required/>
          </div>
          <div>
            <label for="telefone_id">Telefone:</label>
            <input id="telefone_id" name="telefone" type="tel" pattern="[0-9]{11}" placeholder="43911111111" required />
          </div>
          <div>
            <label for="email_id">E-mail:</label>
            <input id="email_id" name="email" type="email" placeholder="felipe@gmail.com" required />
          </div>
          <div>
            <label for="data_nasc_id">Data de nascimento:</label>
            <input id="data_nasc_id" name="data_nasc" type="date" required/>
          </div>

          <fieldset>
            <legend>Endereço</legend>

            <div>
              <label for="logradouro_id">Logradouro:</label>
              <input id="logradouro_id" name="logradouro" type="text" placeholder="Rua" required/>
            </div>

            <div>
              <label for="cidade_id">Cidade-UF</label>
              <input id="cidade_id" name="cidade" type="text" placeholder="Cidade-UF" required/>
            </div>

            <div>
              <label for="numero_id">Número:</label>
              <input id="numero_id" name="numero" type="number" placeholder="Número" required />
            </div>
          </fieldset>
        </fieldset>

        <h2>Escolha do Celular</h2>
        <p>Escolha o modelo que deseja comprar:</p>
        <fieldset> 

        </fieldset>

    </main>

    <footer>
      <p>Todos os direitos reservados &copy;</p>
    </footer>

  </body>
</html>
